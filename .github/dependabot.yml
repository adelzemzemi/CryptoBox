version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # These majors need Node 22, and the suite still has to run on Node 20.
      # Lift them together when Node 20 support is dropped.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
      # Kept on the oldest supported line so a newer Node API cannot slip in unnoticed.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # typescript-eslint 8 does not accept TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    # One pull request for all actions: the CodeQL steps only work at the same version.
    groups:
      github-actions:
        patterns:
          - '*'
