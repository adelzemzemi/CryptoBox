version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Vitest 5 needs Node 22, and the suite still has to run on Node 20.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    # One pull request for all actions: the CodeQL steps only work at the same version.
    groups:
      github-actions:
        patterns:
          - '*'
