name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, to check that a tag points into main.
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify everything before publishing
        run: npm run verify

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Version $pkg matches tag $GITHUB_REF_NAME"

      # A pre-release (2.0.0-rc.1) goes to the "next" dist-tag, so that a plain
      # `npm install` keeps resolving to the last stable version.
      - name: Choose the npm dist-tag
        id: dist-tag
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          case "$pkg" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish
        if: github.event_name == 'push' || inputs.dry-run == false
        run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }} --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
